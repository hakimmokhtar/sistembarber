<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Barber</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 40px; }
        h1 { color: #ffb703; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e24; }
        th, td { padding: 15px; border: 1px solid #333; text-align: left; }
        th { background: #ffb703; color: #1e1e24; }
        tr:hover { background: #2a2a35; }
        .status { padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .pending { background: #fb8500; color: white; }
    </style>
</head>
<body>

    <h1>Senarai Tempahan Pelanggan</h1>
    
    <table>
        <thead>
            <tr>
                <th>Nama</th>
                <th>Telefon</th>
                <th>Barber</th>
                <th>Servis</th>
                <th>Tarikh</th>
                <th>Masa</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="bookingTable">
            </tbody>
    </table>

<script>
        async function ambilData() {
            try {
                // 1. Link mesti kena dengan route kat server.js (ada /admin)
                const resp = await fetch('https://sistembarber-1.onrender.com/api/admin/bookings');
                const data = await resp.json();
                
                const tableBody = document.getElementById('bookingTable');
                tableBody.innerHTML = ''; 

                data.forEach(booking => {
                    let warnaStatus = booking.status === 'Pending' ? 'orange' : 'green';
                    const row = `<tr>
                        <td>${booking.nama}</td>
                        <td>${booking.no_telefon}</td>
                        <td>${booking.barber}</td>
                        <td>${booking.tarikh}</td>
                        <td>${booking.masa}</td>
                        <td style="color: ${warnaStatus}; font-weight: bold;">${booking.status}</td>
                        <td>
                            ${booking.status === 'Pending' ? 
                                `<button onclick="tukarStatus(${booking.id}, 'Selesai')" style="background-color: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;">Selesai</button>` 
                                : 
                                `<span>✅ Setel</span>`
                            }
                        </td>  
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (err) {
                console.error("Gagal tarik data:", err);
            }
        }

        ambilData();
        setInterval(ambilData, 30000);
    </script>
    
</body>
</html>
