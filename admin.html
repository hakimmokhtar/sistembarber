<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Barber</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 40px; }
        h1 { color: #ffb703; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e24; }
        th, td { padding: 15px; border: 1px solid #333; text-align: left; }
        th { background: #ffb703; color: #1e1e24; }
        tr:hover { background: #2a2a35; }
        .status { padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .pending { background: #fb8500; color: white; }
    </style>
</head>
<body>

    <h1>Senarai Tempahan Pelanggan</h1>
    
    <table>
        <thead>
            <tr>
                <th>Nama</th>
                <th>Telefon</th>
                <th>Barber</th>
                <th>Servis</th>
                <th>Tarikh</th>
                <th>Masa</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="bookingTable">
            </tbody>
    </table>

    <script>
        async function ambilData() {
            try {
                const resp = await fetch('http://localhost:3000/api/admin/bookings');
                const data = await resp.json();
                
                const tableBody = document.getElementById('bookingTable');
                tableBody.innerHTML = ''; // Kosongkan jadual dulu

                data.forEach(book => {
                    const row = `<tr>
                        <td>${book.nama_pelanggan}</td>
                        <td>${book.no_telefon}</td>
                        <td>${book.nama_barber}</td>
                        <td>${book.nama_servis}</td>
                        <td>${new Date(book.tarikh).toLocaleDateString()}</td>
                        <td>${book.slot_masa}</td>
                        <td><span class="status pending">${book.status_booking}</span></td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (err) {
                console.error("Gagal tarik data:", err);
            }
        }

        // Jalankan fungsi ambilData bila page dibuka
        ambilData();
        // Refresh data setiap 30 saat secara automatik
        setInterval(ambilData, 30000);
    </script>
</body>
</html>
